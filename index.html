<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu site</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="container-fluid p-5 bg-primary text-white text-center">
        <h1>
            Estilizando e controlando um formulário
        </h1>
    </div>

    <div class="row g-4">
        <!-- Form com Input Groups e Switch -->
        <div class="col-12 col-lg-5">
            <div class="card p-3 shadow-sm border-0">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Nome Completo</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control" placeholder="Ex: Maria Oliveira">
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Endereço de E-mail</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                        <input type="email" class="form-control" placeholder="nome@exemplo.com">
                    </div>
                </div>
                <div class="mb-3 form-check form-switch">
                    <input class="form-check-input" type="checkbox" checked>
                    <label class="form-check-label">Notificar por e-mail</label>
                </div>
                <button class="btn btn-success w-100">Cadastrar Aluno (Estático)</button>
            </div>
        </div>

        <!-- Tabela Responsiva Zebrada com Bordas -->
        <div class="col-12 col-lg-7">
            <div class="table-responsive rounded border">
                <table class="table table-striped table-hover table-bordered border-secondary-subtle align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>#</th>
                            <th>Nome Completo</th>
                            <th>E-mail</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody class="table-group-divider">
                        <tr>
                            <td>1</td>
                            <td class="fw-bold text-primary">Ana Silva</td>
                            <td>ana@exemplo.com</td>
                            <td><span class="badge bg-success">Ativo</span></td>
                        </tr>
                        <tr>
                            <td>2</td>
                            <td class="fw-bold text-primary">Bruno Souza</td>
                            <td>bruno@exemplo.com</td>
                            <td><span class="badge bg-warning text-dark">Pendente</span></td>
                        </tr>
                        <tr>
                            <td>3</td>
                            <td class="fw-bold text-primary">Carla Mendes</td>
                            <td>carla@exemplo.com</td>
                            <td><span class="badge bg-success">Ativo</span></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-4.0.0.module.js"
        integrity="sha256-WK/EJImTrql5EQIEpr2ViDEulDC+Fay9S8aH/huq0IM=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
        </script>
        <script type="module" src="js/app.js"></script>
</body>

</html>
